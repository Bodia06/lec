<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<title>LinkedIn Auto Connect | Professional Automation Tool</title>
		<meta
			name="title"
			content="LinkedIn Auto Connect | Professional Automation Tool"
		/>
		<meta
			name="description"
			content="Boost your professional networking and lead generation with the most secure LinkedIn Auto Connect automation extension."
		/>
		<meta
			name="keywords"
			content="LinkedIn automation, auto connect, networking tool, lead generation, chrome extension"
		/>
		<meta name="author" content="LinkedIn Auto Connect Team" />
		<meta name="robots" content="noindex, nofollow" />
		<meta property="og:type" content="website" />
		<meta
			property="og:title"
			content="LinkedIn Auto Connect | Professional Automation Tool"
		/>
		<meta
			property="og:description"
			content="Boost your professional networking and lead generation with the most secure LinkedIn Auto Connect automation extension."
		/>
		<meta name="theme-color" content="#0a66c2" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<main class="extension-container">
			<header class="app-header">
				<div class="brand">
					<div class="brand-icon" aria-hidden="true">
						<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
							<path
								d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"
							/>
						</svg>
					</div>
					<div class="brand-title">
						<h1>Auto Connect</h1>
						<span>LinkedIn Automation</span>
					</div>
				</div>
				<div
					class="status-badge"
					id="statusBadge"
					role="status"
					aria-live="polite"
				>
					<span class="status-dot"></span>
					<span id="statusText">Ready</span>
				</div>
			</header>

			<section class="stats-card" aria-label="Statistics">
				<div class="stats-info">
					<span class="stats-label">Daily Limit Usage</span>
					<span class="stats-numbers">
						<strong id="dailyCount">0</strong>
						<span class="stats-total">/ <span id="totalLimit">10</span></span>
					</span>
				</div>
				<div
					class="progress-bar"
					role="progressbar"
					aria-valuenow="0"
					aria-valuemin="0"
					aria-valuemax="100"
				>
					<div class="progress-fill" id="progressFill" style="width: 0%"></div>
				</div>
			</section>

			<section class="controls" aria-label="Control Panel">
				<button id="startBtn" class="btn btn-primary" aria-label="Start Bot">
					<svg
						width="15"
						height="15"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2.5"
						aria-hidden="true"
					>
						<polygon points="5 3 19 12 5 21 5 3"></polygon>
					</svg>
					Start Bot
				</button>
				<button
					id="stopBtn"
					class="btn btn-secondary"
					disabled
					aria-label="Stop Bot"
				>
					<svg
						width="15"
						height="15"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2.5"
						aria-hidden="true"
					>
						<rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
					</svg>
					Stop
				</button>
			</section>

			<section class="terminal-section" aria-label="Execution Logs">
				<div class="terminal-header">
					<div class="terminal-title-group">
						<span class="terminal-dot red" aria-hidden="true"></span>
						<span class="terminal-dot yellow" aria-hidden="true"></span>
						<span class="terminal-dot green" aria-hidden="true"></span>
						<span>Live Logs</span>
					</div>
					<button
						id="clearLog"
						class="clear-btn"
						title="Clear Logs"
						aria-label="Clear Logs"
					>
						Clear
					</button>
				</div>
				<div id="log" class="terminal-body" tabindex="0" aria-live="polite">
					System logs will appear here...
				</div>
			</section>
		</main>

		<script type="module" src="popup.js"></script>
	</body>
</html>
